<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SBOS Decision Timeline</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { background: #0a0a0f; color: #e2e8f0; font-family: 'Inter', -apple-system, sans-serif; margin: 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp .4s ease-out both; }
  .timeline-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: linear-gradient(to bottom, rgba(99,102,241,.4), rgba(99,102,241,.1)); transform: translateX(-50%); }
  .decision-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; transition: all .2s; max-width: 400px; }
  .decision-card:hover { border-color: rgba(255,255,255,.18); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .node { width: 16px; height: 16px; border-radius: 50%; border: 3px solid; position: absolute; left: 50%; transform: translateX(-50%); z-index: 10; background: #0a0a0f; }
  .cat-badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .filter-btn { padding: 4px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; transition: all .2s; border: 1px solid transparent; background: rgba(255,255,255,.04); color: #6b7280; }
  .filter-btn.active { border-color: rgba(255,255,255,.2); color: white; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const CAT_COLORS = { Financial: "#10b981", Work: "#3b82f6", Personal: "#f59e0b", System: "#6b7280", Travel: "#8b5cf6" };
const CAT_ICONS = { Financial: "💰", Work: "💼", Personal: "🧠", System: "⚙️", Travel: "✈️" };

const DECISIONS = [
  { id: 1, decision: "Adopt SBOS as primary life operating system", category: "System", date: "2026-03-01", why: "Needed one unified system instead of 7 fragmented Notion workspaces", impact: "Consolidated all systems; massive clarity and reduced friction" },
  { id: 2, decision: "Use debt avalanche strategy over snowball", category: "Financial", date: "2026-02-28", why: "Higher APR cards cost more over time; math favors avalanche at $30K income", impact: "$38,638 CC debt targeted for elimination by Dec 2026" },
  { id: 3, decision: "Allocate $8K/month to debt attack", category: "Financial", date: "2026-02-28", why: "Aggressive but sustainable with $30K take-home; leaves room for lifestyle", impact: "Projected 10-month payoff timeline" },
  { id: 4, decision: "Deploy interactive dashboards via GitHub Pages", category: "System", date: "2026-03-03", why: "Notion lacks interactive visualizations; GitHub Pages is free and fast", impact: "Real-time visual dashboards embedded directly in Notion" },
  { id: 5, decision: "Implement 4-phase financial plan", category: "Financial", date: "2026-02-27", why: "Sequential approach ensures each phase builds on the previous one", impact: "Clear roadmap from debt → emergency fund → loans → investing" },
  { id: 6, decision: "Morning Sweep as daily anchor routine", category: "Personal", date: "2026-03-02", why: "Starting the day with full context reduces decision fatigue", impact: "Calendar + email + tasks + priorities reviewed in one sweep" },
  { id: 7, decision: "Track 7 life areas with health scores", category: "Personal", date: "2026-03-03", why: "Prevents tunnel vision on one area while others deteriorate", impact: "Balanced attention across Career, Finance, Health, Growth, Relationships, Projects, Mindfulness" },
  { id: 8, decision: "Cancel non-essential subscriptions", category: "Financial", date: "2026-03-01", why: "Every dollar saved accelerates debt payoff", impact: "Identified $67/mo in potentially cuttable subscriptions" },
];

function DecisionTimeline() {
  const [filter, setFilter] = useState("All");
  const categories = ["All", ...Object.keys(CAT_COLORS)];
  const filtered = filter === "All" ? DECISIONS : DECISIONS.filter(d => d.category === filter);
  const sorted = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));

  return (
    <div className="max-w-5xl mx-auto p-6">
      {/* Header */}
      <div className="text-center mb-8 fade-up">
        <div className="text-3xl mb-2">📝</div>
        <h1 className="text-2xl font-bold">Decision Timeline</h1>
        <p className="text-gray-500 text-sm mt-1">Every decision shapes your trajectory — track them, learn from them</p>
      </div>

      {/* Filters */}
      <div className="flex gap-2 justify-center mb-8 fade-up" style={{ animationDelay: ".1s" }}>
        {categories.map(c => (
          <button key={c} onClick={() => setFilter(c)}
            className={`filter-btn ${filter === c ? "active" : ""}`}
            style={filter === c ? { background: (CAT_COLORS[c] || "rgba(255,255,255,.15)") + "22", borderColor: CAT_COLORS[c] || "rgba(255,255,255,.2)" } : {}}>
            {CAT_ICONS[c] || "🔍"} {c}
          </button>
        ))}
      </div>

      {/* Stats */}
      <div className="grid grid-cols-5 gap-3 mb-8 fade-up" style={{ animationDelay: ".15s" }}>
        {Object.entries(CAT_COLORS).map(([cat, color]) => {
          const count = DECISIONS.filter(d => d.category === cat).length;
          return (
            <div key={cat} className="text-center p-3 rounded-xl" style={{ background: color + "11", border: `1px solid ${color}33` }}>
              <div className="text-lg">{CAT_ICONS[cat]}</div>
              <div className="text-xl font-bold" style={{ color }}>{count}</div>
              <div className="text-xs text-gray-500">{cat}</div>
            </div>
          );
        })}
      </div>

      {/* Timeline */}
      <div className="relative" style={{ minHeight: sorted.length * 180 }}>
        <div className="timeline-line" />
        {sorted.map((d, i) => {
          const isLeft = i % 2 === 0;
          const color = CAT_COLORS[d.category] || "#6b7280";
          const dateStr = new Date(d.date).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
          return (
            <div key={d.id} className="relative fade-up" style={{ animationDelay: `${.2 + i * .08}s`, marginBottom: 32 }}>
              {/* Node */}
              <div className="node" style={{ borderColor: color, top: 24 }} />
              {/* Date bubble */}
              <div className="absolute text-xs font-mono px-2 py-1 rounded-full" style={{
                left: "50%", transform: "translateX(-50%)", top: -8,
                background: color + "22", color, border: `1px solid ${color}44`
              }}>{dateStr}</div>
              {/* Card */}
              <div className={`decision-card p-4 ${isLeft ? "mr-auto" : "ml-auto"}`} style={{ marginTop: 16, [isLeft ? "marginRight" : "marginLeft"]: "calc(50% + 32px)" }}>
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-lg">{CAT_ICONS[d.category]}</span>
                  <span className="cat-badge" style={{ background: color + "22", color }}>{d.category}</span>
                </div>
                <h3 className="font-semibold text-sm mb-2">{d.decision}</h3>
                <div className="space-y-2">
                  <div>
                    <span className="text-xs text-gray-500 font-semibold">WHY:</span>
                    <p className="text-xs text-gray-400 mt-0.5">{d.why}</p>
                  </div>
                  <div>
                    <span className="text-xs font-semibold" style={{ color }}>IMPACT:</span>
                    <p className="text-xs text-gray-300 mt-0.5">{d.impact}</p>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="text-center mt-8 text-xs text-gray-600">
        SBOS Decision Timeline v1.0 — {DECISIONS.length} decisions logged
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DecisionTimeline />);
</script>
</body>
</html>
