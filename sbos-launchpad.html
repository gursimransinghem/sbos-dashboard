<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SBOS Launchpad</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { background: #0a0a0f; color: #e2e8f0; font-family: 'Inter', -apple-system, sans-serif; margin: 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp .4s ease-out both; }
  .cmd-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; cursor: pointer; transition: all .25s; position: relative; overflow: hidden; }
  .cmd-card:hover { transform: translateY(-4px) scale(1.02); border-color: rgba(255,255,255,.2); box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  .cmd-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; opacity: 0; transition: opacity .25s; }
  .cmd-card:hover::before { opacity: 1; }
  .search-box { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; }
  .search-box:focus-within { border-color: rgba(99,102,241,.5); box-shadow: 0 0 20px rgba(99,102,241,.15); }
  .cat-pill { border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; transition: all .2s; border: 1px solid transparent; }
  .cat-pill.active { border-color: rgba(255,255,255,.3); }
  .quick-link { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); border-radius: 10px; transition: all .2s; }
  .quick-link:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.15); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const COMMANDS = [
  { cmd: "MP", name: "Morning Plan", icon: "🌅", category: "Daily", desc: "Full morning sweep: calendar, email, tasks, priorities", color: "#f59e0b", notionUrl: "https://www.notion.so/3f126d66ea5d4c47a750fc842fbf7ace" },
  { cmd: "QC", name: "Quick Capture", icon: "⚡", category: "Daily", desc: "Rapid thought/task capture to inbox", color: "#3b82f6", notionUrl: "https://www.notion.so/caf0800f52844ad481b43a5620d61fdd" },
  { cmd: "TR", name: "Task Review", icon: "✅", category: "Daily", desc: "Review and reprioritize active tasks", color: "#10b981", notionUrl: "https://www.notion.so/9dabe3320bf743fdba25867ef8b854f8" },
  { cmd: "GR", name: "Goal Review", icon: "🎯", category: "Review", desc: "Check progress on SMART goals and milestones", color: "#8b5cf6", notionUrl: "https://www.notion.so/58c592867b1c4bb397a0a4e6c927cfec" },
  { cmd: "WR", name: "Weekly Review", icon: "📊", category: "Review", desc: "End-of-week reflection, wins, and planning", color: "#ec4899", notionUrl: "https://www.notion.so/9aaedcc2893042978469abc3025593b7" },
  { cmd: "HL", name: "Habit Log", icon: "🔄", category: "Daily", desc: "Track daily habits and streaks", color: "#06b6d4", notionUrl: "https://www.notion.so/031bc1097013457fba79c1e62014b19f" },
  { cmd: "JL", name: "Journal Log", icon: "📓", category: "Daily", desc: "Daily reflection, mood, and gratitude", color: "#f97316", notionUrl: "https://www.notion.so/2200b3eef7ff4796832d23d5ef311be0" },
  { cmd: "LA", name: "Life Areas Check", icon: "🏛", category: "Review", desc: "Health check across 7 life pillars", color: "#14b8a6", notionUrl: "https://www.notion.so/b56247f3eeb54fbda3fa293ca59dace6" },
  { cmd: "FC", name: "Finance Check", icon: "💰", category: "Finance", desc: "Quick financial snapshot and debt progress", color: "#22c55e", notionUrl: "https://www.notion.so/3177ca56e9cf810b8fd6d240c3103f88" },
];

const QUICK_LINKS = [
  { name: "SBOS Home", icon: "🏠", url: "https://www.notion.so/3187ca56e9cf818c8ad8ddc0346ad013" },
  { name: "Command Center", icon: "🧠", url: "https://www.notion.so/3067ca56e9cf819da9c5ce8945b8634f" },
  { name: "Finance HQ", icon: "💵", url: "https://www.notion.so/3177ca56e9cf810b8fd6d240c3103f88" },
  { name: "Tasks Master", icon: "✅", url: "https://www.notion.so/9dabe3320bf743fdba25867ef8b854f8" },
  { name: "Interactive Dashboard", icon: "📈", url: "https://gursimransinghem.github.io/sbos-dashboard/" },
  { name: "Finance Dashboard", icon: "💰", url: "https://gursimransinghem.github.io/sbos-dashboard/finance-dashboard.html" },
];

const CATEGORIES = ["All", "Daily", "Review", "Finance"];
const CAT_COLORS = { Daily: "#f59e0b", Review: "#8b5cf6", Finance: "#22c55e" };

function Launchpad() {
  const [search, setSearch] = useState("");
  const [cat, setCat] = useState("All");
  const [time, setTime] = useState(new Date());
  const inputRef = useRef(null);

  useEffect(() => {
    const t = setInterval(() => setTime(new Date()), 1000);
    const handleKey = (e) => { if (e.key === "/" && !e.ctrlKey && !e.metaKey) { e.preventDefault(); inputRef.current?.focus(); } };
    window.addEventListener("keydown", handleKey);
    return () => { clearInterval(t); window.removeEventListener("keydown", handleKey); };
  }, []);

  const filtered = COMMANDS.filter(c => {
    const matchSearch = search === "" || c.cmd.toLowerCase().includes(search.toLowerCase()) || c.name.toLowerCase().includes(search.toLowerCase()) || c.desc.toLowerCase().includes(search.toLowerCase());
    const matchCat = cat === "All" || c.category === cat;
    return matchSearch && matchCat;
  });

  const greeting = time.getHours() < 12 ? "Good morning" : time.getHours() < 17 ? "Good afternoon" : "Good evening";

  return (
    <div className="max-w-4xl mx-auto p-6">
      {/* Header */}
      <div className="text-center mb-8 fade-up">
        <div className="text-4xl mb-2">⌘</div>
        <h1 className="text-2xl font-bold text-white">SBOS Launchpad</h1>
        <p className="text-gray-500 text-sm mt-1">{greeting}, Sim — {time.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}</p>
      </div>

      {/* Search */}
      <div className="search-box flex items-center px-4 py-3 mb-4 fade-up" style={{ animationDelay: ".1s" }}>
        <span className="text-gray-500 mr-3">🔍</span>
        <input ref={inputRef} type="text" placeholder="Search commands... (press / to focus)" value={search} onChange={e => setSearch(e.target.value)}
          className="bg-transparent outline-none flex-1 text-sm text-white placeholder-gray-600" />
        {search && <button onClick={() => setSearch("")} className="text-gray-500 hover:text-white text-xs">✕</button>}
      </div>

      {/* Category Pills */}
      <div className="flex gap-2 mb-6 justify-center fade-up" style={{ animationDelay: ".15s" }}>
        {CATEGORIES.map(c => (
          <button key={c} onClick={() => setCat(c)}
            className={`cat-pill ${cat === c ? "active" : ""}`}
            style={{ background: cat === c ? (CAT_COLORS[c] || "rgba(255,255,255,.1)") + "22" : "rgba(255,255,255,.04)", color: cat === c ? (CAT_COLORS[c] || "#fff") : "#6b7280" }}>
            {c}
          </button>
        ))}
      </div>

      {/* Command Grid */}
      <div className="grid grid-cols-3 gap-4 mb-8">
        {filtered.map((c, i) => (
          <a key={c.cmd} href={c.notionUrl} target="_blank" rel="noopener noreferrer"
            className="cmd-card p-5 fade-up block no-underline text-inherit" style={{ animationDelay: `${.2 + i * .05}s` }}>
            <div style={{ background: `linear-gradient(90deg, ${c.color}, transparent)` }} className="absolute top-0 left-0 right-0 h-0.5 opacity-0 transition-opacity" />
            <div className="flex items-start justify-between mb-3">
              <div className="text-3xl">{c.icon}</div>
              <span className="text-xs font-mono px-2 py-1 rounded-md" style={{ background: c.color + "22", color: c.color }}>{c.cmd}</span>
            </div>
            <h3 className="font-semibold text-sm text-white mb-1">{c.name}</h3>
            <p className="text-xs text-gray-500 leading-relaxed">{c.desc}</p>
            <div className="mt-3 flex items-center gap-2">
              <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: (CAT_COLORS[c.category] || "#6b7280") + "22", color: CAT_COLORS[c.category] || "#6b7280" }}>{c.category}</span>
            </div>
          </a>
        ))}
      </div>

      {filtered.length === 0 && (
        <div className="text-center py-12 text-gray-500">
          <div className="text-4xl mb-3">🔍</div>
          <p>No commands match "{search}"</p>
        </div>
      )}

      {/* Quick Links */}
      <div className="fade-up" style={{ animationDelay: ".5s" }}>
        <h3 className="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Quick Links</h3>
        <div className="grid grid-cols-6 gap-2">
          {QUICK_LINKS.map((l, i) => (
            <a key={i} href={l.url} target="_blank" rel="noopener noreferrer" className="quick-link p-3 text-center no-underline text-inherit">
              <div className="text-xl mb-1">{l.icon}</div>
              <div className="text-xs text-gray-400">{l.name}</div>
            </a>
          ))}
        </div>
      </div>

      {/* Keyboard Shortcut Hint */}
      <div className="text-center mt-8 text-xs text-gray-600">
        Press <kbd className="px-1.5 py-0.5 bg-gray-800 rounded text-gray-400">/</kbd> to search • Click any command to open in Notion
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Launchpad />);
</script>
</body>
</html>
