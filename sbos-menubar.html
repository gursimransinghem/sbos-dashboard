<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SBOS Menu Bar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d12; color: #e2e8f0; font-family: -apple-system, 'SF Pro Display', 'Inter', sans-serif; width: 320px; overflow: hidden; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .7; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .container { padding: 12px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .logo { font-size: 11px; font-weight: 700; color: #6366f1; letter-spacing: 1px; }
  .clock { font-size: 11px; color: #64748b; font-family: 'SF Mono', monospace; }
  .debt-hero { background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(245,158,11,.08)); border: 1px solid rgba(239,68,68,.2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .debt-label { font-size: 9px; text-transform: uppercase; letter-spacing: .8px; color: #94a3b8; margin-bottom: 4px; }
  .debt-amount { font-size: 22px; font-weight: 800; color: #f87171; font-variant-numeric: tabular-nums; }
  .debt-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .progress-bg { flex: 1; height: 5px; background: rgba(255,255,255,.08); border-radius: 99px; margin: 0 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #10b981, #34d399); transition: width 1s; }
  .debt-pct { font-size: 10px; font-weight: 700; color: #10b981; min-width: 32px; text-align: right; }
  .debt-paid { font-size: 10px; color: #64748b; }
  .freedom { display: flex; align-items: center; gap: 4px; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.06); }
  .freedom-icon { font-size: 12px; animation: pulse 2s infinite; }
  .freedom-text { font-size: 10px; color: #a78bfa; font-weight: 600; }
  .freedom-date { font-size: 10px; color: #64748b; margin-left: auto; }
  .section { margin-bottom: 8px; }
  .section-title { font-size: 9px; text-transform: uppercase; letter-spacing: .8px; color: #475569; margin-bottom: 6px; font-weight: 600; }
  .task-item { display: flex; align-items: flex-start; gap: 6px; padding: 5px 8px; border-radius: 6px; margin-bottom: 3px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05); }
  .task-priority { font-size: 8px; padding: 1px 5px; border-radius: 4px; font-weight: 700; white-space: nowrap; margin-top: 1px; }
  .p1 { background: rgba(239,68,68,.15); color: #f87171; }
  .p2 { background: rgba(245,158,11,.15); color: #fbbf24; }
  .task-name { font-size: 11px; color: #cbd5e1; line-height: 1.3; }
  .task-time { font-size: 9px; color: #475569; margin-top: 1px; }
  .stats-row { display: flex; gap: 6px; }
  .stat { flex: 1; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 6px 8px; text-align: center; }
  .stat-value { font-size: 14px; font-weight: 700; }
  .stat-label { font-size: 8px; color: #64748b; text-transform: uppercase; letter-spacing: .5px; margin-top: 1px; }
  .green { color: #10b981; } .red { color: #f87171; } .blue { color: #60a5fa; } .purple { color: #a78bfa; }
  .links { display: flex; gap: 4px; margin-top: 8px; }
  .link-btn { flex: 1; text-align: center; padding: 6px; border-radius: 6px; font-size: 9px; color: #94a3b8; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); text-decoration: none; transition: all .2s; cursor: pointer; }
  .link-btn:hover { background: rgba(255,255,255,.1); color: white; border-color: rgba(255,255,255,.15); }
</style>
</head>
<body>
<div class="container" id="app"></div>
<script src="notion-sync.js"></script>
<script>
// ═══ LOCALSTORAGE PERSISTENCE ═══
function loadMenuData() {
  try { const v = localStorage.getItem('sbos_menubar'); return v ? JSON.parse(v) : null; } catch { return null; }
}
function saveMenuData(data) {
  try { localStorage.setItem('sbos_menubar', JSON.stringify({ ...data, lastUpdated: new Date().toISOString() })); } catch {}
}

// ═══ CONFIG - Update these values to match your real data ═══
const saved = loadMenuData();
const DEBT_TOTAL = saved?.debtTotal || 38638;
const DEBT_REMAINING = saved?.debtRemaining || 38640;
const MONTHLY_INCOME = 30000;
const DEBT_ATTACK = 8000;
const FREEDOM_DATE = "Dec 2026";
const TASKS = [
  { name: "Renew Florida Medical License", priority: "P1", time: "1 hr" },
  { name: "Handle Apple Trade-In", priority: "P1", time: "15 min" },
  { name: "Review Rocket Money Feb Report", priority: "P2", time: "15 min" },
];
const INBOX_COUNT = 3;
const ACTIVE_TASKS = 6;

// ═══ RENDER ═══
function render() {
  const now = new Date();
  const paid = DEBT_TOTAL - DEBT_REMAINING;
  const pct = Math.max(0, Math.round((paid / DEBT_TOTAL) * 100));
  const monthsLeft = Math.ceil(DEBT_REMAINING / DEBT_ATTACK);
  const greeting = now.getHours() < 12 ? "Good morning" : now.getHours() < 17 ? "Good afternoon" : "Good evening";

  document.getElementById("app").innerHTML = `
    <div class="header">
      <div class="logo">⌘ SBOS</div>
      <div class="clock">${now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div>
    </div>

    <div class="debt-hero">
      <div class="debt-label">CC Debt Remaining</div>
      <div class="debt-amount">$${DEBT_REMAINING.toLocaleString()}</div>
      <div class="debt-row">
        <div class="debt-paid">$${paid.toLocaleString()} paid</div>
        <div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="debt-pct">${pct}%</div>
      </div>
      <div class="freedom">
        <span class="freedom-icon">🎯</span>
        <span class="freedom-text">Freedom: ${FREEDOM_DATE}</span>
        <span class="freedom-date">~${monthsLeft} months</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🔴 Top Priority</div>
      ${TASKS.map(t => `
        <div class="task-item">
          <span class="task-priority ${t.priority.toLowerCase()}">${t.priority}</span>
          <div>
            <div class="task-name">${t.name}</div>
            <div class="task-time">${t.time}</div>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="stats-row">
      <div class="stat"><div class="stat-value blue">${ACTIVE_TASKS}</div><div class="stat-label">Active Tasks</div></div>
      <div class="stat"><div class="stat-value purple">${INBOX_COUNT}</div><div class="stat-label">Inbox</div></div>
      <div class="stat"><div class="stat-value green">$${(DEBT_ATTACK/1000).toFixed(0)}K</div><div class="stat-label">Debt/Mo</div></div>
      <div class="stat"><div class="stat-value red">$${(MONTHLY_INCOME/1000).toFixed(0)}K</div><div class="stat-label">Income</div></div>
    </div>

    <div class="links">
      <a class="link-btn" href="https://gursimransinghem.github.io/sbos-dashboard/" target="_blank">📊 Dashboard</a>
      <a class="link-btn" href="https://gursimransinghem.github.io/sbos-dashboard/finance-dashboard.html" target="_blank">💰 Finance</a>
      <a class="link-btn" href="https://gursimransinghem.github.io/sbos-dashboard/sbos-launchpad.html" target="_blank">⌘ Launch</a>
      <a class="link-btn" href="https://www.notion.so/3187ca56e9cf818c8ad8ddc0346ad013" target="_blank">🏠 Notion</a>
    </div>
  `;
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
