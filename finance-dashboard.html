<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SBOS Finance Command Center</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
<style>
  body { background: #0a0a0f; color: #e2e8f0; font-family: 'Inter', -apple-system, sans-serif; margin: 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
  @keyframes countUp { from { opacity: 0; } to { opacity: 1; } }
  .fade-up { animation: fadeUp .5s ease-out both; }
  .card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; transition: all .2s; }
  .card:hover { border-color: rgba(255,255,255,.15); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .glow-green { box-shadow: 0 0 20px rgba(16,185,129,.15); }
  .glow-red { box-shadow: 0 0 20px rgba(239,68,68,.15); }
  .glow-blue { box-shadow: 0 0 20px rgba(59,130,246,.15); }
  .glow-purple { box-shadow: 0 0 20px rgba(139,92,246,.15); }
  .progress-track { background: rgba(255,255,255,.08); border-radius: 999px; height: 10px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; transition: width 1s ease-out; }
  .debt-thermometer { width: 40px; border-radius: 20px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.1); position: relative; overflow: hidden; }
  .debt-fill { position: absolute; bottom: 0; left: 0; right: 0; border-radius: 0 0 18px 18px; transition: height 1s ease-out; }
  .bill-row:nth-child(even) { background: rgba(255,255,255,.02); }
  .phase-active { border: 2px solid #10b981; background: rgba(16,185,129,.08); }
  .phase-future { border: 2px solid rgba(255,255,255,.1); opacity: .5; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/finance.jsx"></script>
</body>
</html>
